services:
  db:
    image: postgres:16
    container_name: risk_summary_db
    environment:
      POSTGRES_DB: risk_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - .:/app:ro

volumes:
  postgres_data:
